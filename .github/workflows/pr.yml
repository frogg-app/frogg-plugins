name: Validate plugins

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frogg CLI and plugin API types
        env:
          FROGG_VERSION: ${{ vars.FROGG_VERSION }}
          FROGG_REF: ${{ vars.FROGG_REF }}
        run: scripts/fetch-frogg.sh
      - run: npm ci
      - name: Typecheck plugins
        run: npm run typecheck --workspaces --if-present
      - name: Build, validate manifests and pack
        run: scripts/build-all.sh
      - name: Build index.json (unsigned)
        run: >-
          frogg plugins index build
          --plugins plugins
          --categories categories.json
          --tarballs out
          --base-url https://example.invalid/
          --commit "${{ github.sha }}"
          --out out/index.json
