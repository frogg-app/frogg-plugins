name: Publish plugin index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Build and pack every plugin
        run: scripts/build-all.sh
      - name: Build index.json
        run: >-
          npx frogg plugins index build
          --plugins plugins
          --categories categories.json
          --tarballs out
          --base-url "${{ steps.pages.outputs.base_url }}"
          --commit "${{ github.sha }}"
          --name "${{ vars.PLUGIN_REPO_NAME || github.repository }}"
          --out out/index.json
      - name: Sign index.json
        env:
          PLUGIN_REPO_SIGNING_KEY: ${{ secrets.PLUGIN_REPO_SIGNING_KEY }}
        run: npx frogg plugins index sign out/index.json --key-env PLUGIN_REPO_SIGNING_KEY
      - name: Verify signature and tarball hashes
        run: >-
          npx frogg plugins index verify out/index.json
          --public-key "${{ vars.PLUGIN_REPO_PUBLIC_KEY }}"
          --tarballs out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
