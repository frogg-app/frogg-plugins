name: Publish plugin index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install frogg CLI and plugin API types
        env:
          FROGG_VERSION: ${{ vars.FROGG_VERSION }}
          FROGG_REF: ${{ vars.FROGG_REF }}
        run: scripts/fetch-frogg.sh
      - run: npm ci
      - name: Build and pack every plugin
        run: scripts/build-all.sh
      # Writes index.json (plugin API v1 only, for hosts that predate v2) and index.v2.json (all).
      - name: Build index.json and index.v2.json
        run: >-
          frogg plugins index build
          --plugins plugins
          --categories categories.json
          --tarballs out
          --base-url "${{ steps.pages.outputs.base_url }}"
          --commit "${{ github.sha }}"
          --name "${{ vars.PLUGIN_REPO_NAME || github.repository }}"
          --out out/index.json
      - name: Sign both indexes
        env:
          PLUGIN_REPO_SIGNING_KEY: ${{ secrets.PLUGIN_REPO_SIGNING_KEY }}
        run: |
          frogg plugins index sign out/index.json --key-env PLUGIN_REPO_SIGNING_KEY
          if [ -f out/index.v2.json ]; then frogg plugins index sign out/index.v2.json --key-env PLUGIN_REPO_SIGNING_KEY; fi
      - name: Verify signatures and tarball hashes
        run: |
          for f in out/index.json out/index.v2.json; do
            [ -f "$f" ] || continue
            frogg plugins index verify "$f" --public-key "${{ vars.PLUGIN_REPO_PUBLIC_KEY }}" --tarballs out
          done
      - name: index.json must stay plugin API v1 only
        run: |
          if jq -e '[.plugins[].versions[] | select(.apiVersion != 1)] | length > 0' out/index.json >/dev/null; then
            echo "index.json lists a non-v1 version; hosts that predate v2 would reject the whole index" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
